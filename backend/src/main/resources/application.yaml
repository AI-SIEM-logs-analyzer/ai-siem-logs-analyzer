# Configuration for the backend. YAML is the single source in the repo — there is no
# application.properties, because Quarkus would silently give this file precedence over it.
#
# Precedence, lowest to highest: this file < backend/.env (dev mode only) < environment
# variables < system properties. Every key below can therefore be overridden without a
# rebuild: app.ai.api-key becomes APP_AI_API_KEY, quarkus.http.port becomes
# QUARKUS_HTTP_PORT, and so on (dots and dashes become underscores, all uppercase).
#
# Secrets never live in this file. See backend/.env.example.

quarkus:
  application:
    name: siem-backend

  # --- HTTP ---
  http:
    port: 8080
    limits:
      # Deliberately above app.upload.max-file-size-bytes. This limit exists so a runaway body is
      # cut off at the connection before it is spooled to disk; the application limit exists so an
      # upload that is merely too large gets a 413 that names the limit it exceeded. Raise both
      # together, keeping this one the larger of the two.
      max-body-size: 60M

  # --- OpenAPI / Swagger UI ---
  # Swagger UI is dev-mode-only unless always-include is set; the packaged app is
  # expected to serve /q/swagger-ui too.
  swagger-ui:
    always-include: true

  # --- Container image (Jib) ---
  # cd.yml overrides registry, group and tags on the command line; everything else is
  # defined here so the local image and the published one stay the same build.
  container-image:
    group: siem
    name: security-log-analyzer-backend
  jib:
    base-jvm-image: registry.access.redhat.com/ubi9/openjdk-21-runtime

  # --- Persistence ---
  # Flyway owns the schema outright: it applies db/migration on start-up, and Hibernate is
  # limited to checking that the entity mappings match what the migrations produced. Drift
  # between an entity and the schema therefore fails the boot instead of the first query
  # that happens to touch the wrong column.
  datasource:
    db-kind: postgresql
  hibernate-orm:
    schema-management:
      strategy: validate
    mapping:
      format:
        global: ignore
  flyway:
    migrate-at-start: true

  # --- Authorisation ---
  # A JAX-RS endpoint with no security annotation is refused rather than served. The failure
  # mode of forgetting an annotation should be a 403 someone reports, not an open endpoint
  # nobody notices. The management endpoints (/q/health, /q/openapi) are not JAX-RS resources
  # and are unaffected.
  security:
    jaxrs:
      deny-unannotated-endpoints: true

mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: SIEM Logs Analyzer API
          version: 0.1.0
          description: AI-assisted SIEM log analysis platform — backend API.
  # --- Tokens ---
  # The verifier is told the same issuer the builder stamps, so a token minted elsewhere is
  # rejected even when it is signed with a key this deployment happens to trust.
  jwt:
    verify:
      issuer: ${app.auth.issuer}
  # --- Reactive Messaging (Kafka / Redpanda) ---
  messaging:
    outgoing:
      "logs.ingest":
        connector: smallrye-kafka
        topic: logs.ingest
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer

# --- Application settings (mapped by com.siem.analyzer.config.AppConfig) ---
# app.ai.api-key is intentionally absent here: it is a secret, so it has to come from the
# environment. The dev and test profiles below substitute a placeholder; prod does not,
# which makes a deployment without APP_AI_API_KEY fail at start-up instead of at runtime.
app:
  environment: local
  storage:
    upload-dir: data/uploads
  # Limits applied to an uploaded log file. The defaults live in AppConfig.Upload; they are
  # repeated here so the knobs are discoverable, and each one can be overridden per environment
  # (APP_UPLOAD_MAX_FILE_SIZE_BYTES, and so on).
  upload:
    max-file-size-bytes: 52428800
    allowed-extensions: log,txt,json,ndjson,csv
    allowed-content-types: text/plain,application/json,text/csv,application/octet-stream
    sniff-bytes: 8192
    rate-limit:
      requests: 20
      window: PT1M
  security:
    # Argon2id cost, applied to every password this application hashes. The defaults live in
    # AppConfig; they are repeated here so the knobs are discoverable, and each one can be
    # overridden per environment (APP_SECURITY_ARGON2_MEMORY_KIB, and so on). Raise them until
    # a single hash costs roughly half a second on the deployment's hardware. Stored hashes
    # stay verifiable across a change: the parameters are read back from the hash itself.
    argon2:
      memory-kib: 19456
      iterations: 2
      parallelism: 1
      hash-length-bytes: 32
      salt-length-bytes: 16
  auth:
    # Identifies this deployment as the minter of a token. Override per environment
    # (APP_AUTH_ISSUER); mp.jwt.verify.issuer below follows it automatically.
    issuer: https://siem-analyzer.local/auth
    access-ttl: PT15M
    refresh-ttl: P14D
    rate-limit:
      attempts: 10
      window: PT15M

"%dev":
  app:
    environment: dev
    ai:
      api-key: dev-placeholder
    storage:
      upload-dir: target/dev-uploads
  kafka:
    bootstrap:
      servers: localhost:19092
  quarkus:
    log:
      category:
        "com.siem":
          level: DEBUG
    datasource:
      jdbc:
        url: jdbc:postgresql://localhost:5432/siem
      username: siem
      # Mirrors docker/.env.example, so `make up` followed by `./mvnw quarkus:dev` works with
      # no further setup. Not a secret: it is the throwaway credential of the local Compose
      # stack, already committed there in plain text, and it applies only under %dev.
      password: ${POSTGRES_PASSWORD:siem_local_dev}
    # The Compose stack, whose password comes from docker/.env. Mirrors the datasource block
    # above: `make up` plus `./mvnw quarkus:dev` works with nothing else set.
    redis:
      hosts: redis://localhost:6379
      password: ${REDIS_PASSWORD:siem_local_dev}
  # Committed throwaway pair; see backend/dev-keys/README.md. Referenced by file path rather
  # than from the classpath so that it stays out of the jar and the container image.
  mp:
    jwt:
      verify:
        publickey:
          location: file:./dev-keys/publicKey.pem
  smallrye:
    jwt:
      sign:
        key:
          location: file:./dev-keys/privateKey.pem

"%test":
  app:
    environment: test
    ai:
      api-key: test-placeholder
    storage:
      upload-dir: target/test-uploads
    # The suite uploads repeatedly as the same test users, and the counter outlives a single test.
    # An allowance well above what any test class spends keeps the limit from firing where it is
    # not the thing under test; LogUploadRateLimitTest lowers it for itself instead.
    upload:
      rate-limit:
        requests: 100
    # A production-cost hash takes hundreds of milliseconds by design, and the suite hashes
    # on nearly every test. These values keep Argon2id exercised for real — same algorithm,
    # same encoding, same verification path — at a cost the test run can absorb. They are
    # test-only and must not be copied into another profile.
    security:
      argon2:
        memory-kib: 512
        iterations: 1
  quarkus:
    # Deliberately no JDBC URL: with none configured, Dev Services starts a throwaway
    # PostgreSQL container through Testcontainers, lets Flyway migrate it, and tears it down
    # when the suite ends. Pinning the image keeps tests, the Compose stack and production on
    # the same PostgreSQL version.
    datasource:
      devservices:
        image-name: postgres:16-alpine
    # No hosts on purpose: Dev Services starts a throwaway Redis through Testcontainers, the
    # same arrangement the datasource uses. The image is pinned to the Compose version so the
    # suite, the local stack and production agree on the server's behaviour.
    redis:
      devservices:
        image-name: redis:7-alpine
  mp:
    jwt:
      verify:
        publickey:
          location: classpath:jwt/publicKey.pem
  smallrye:
    jwt:
      sign:
        key:
          location: classpath:jwt/privateKey.pem

"%prod":
  app:
    environment: prod
  # No datasource keys here on purpose. Production supplies QUARKUS_DATASOURCE_JDBC_URL,
  # QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD through the environment, and
  # Dev Services never run under prod, so a deployment without them aborts at start-up rather
  # than serving requests against no database. Same fail-fast contract as APP_AI_API_KEY.
  # No key locations here on purpose. Production supplies SMALLRYE_JWT_SIGN_KEY_LOCATION and
  # MP_JWT_VERIFY_PUBLICKEY_LOCATION through the environment; TokenService proves at start-up
  # that both load, so a deployment without them aborts instead of failing the first sign-in.
  # No Redis keys here either. Production supplies QUARKUS_REDIS_HOSTS and
  # QUARKUS_REDIS_PASSWORD through the environment, and Dev Services never runs under prod, so
  # a deployment without Redis fails at start-up rather than failing the first refresh.
