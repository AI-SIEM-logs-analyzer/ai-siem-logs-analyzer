quarkus.application.name=siem-backend

# --- HTTP ---
quarkus.http.port=8080

# --- OpenAPI / Swagger UI ---
# Swagger UI is dev-mode-only unless always-include is set; the packaged app is
# expected to serve /q/swagger-ui too.
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=SIEM Logs Analyzer API
mp.openapi.extensions.smallrye.info.version=0.1.0
mp.openapi.extensions.smallrye.info.description=AI-assisted SIEM log analysis platform — backend API.

# --- Container image (Jib) ---
# cd.yml overrides registry, group and tags on the command line; everything else is
# defined here so the local image and the published one stay the same build.
quarkus.container-image.group=siem
quarkus.container-image.name=security-log-analyzer-backend
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime
