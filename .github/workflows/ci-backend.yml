name: CI · Backend (Quarkus)

# Rulează pe fiecare PR, indiferent de fișierele atinse: un check filtrat pe `paths` nu
# pornește deloc pe PR-urile care nu ating backend/, iar branch protection îl așteaptă la
# nesfârșit. Push-urile pe branch-uri de lucru rămân filtrate.
on:
  pull_request:
  push:
    branches-ignore: ['main']
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verifică formatarea (Spotless)
        run: ./mvnw -B spotless:check

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Build + teste (JUnit5 + RestAssured, Testcontainers)
        run: ./mvnw -B clean verify

      # `warn`, nu `ignore`: raportul lipsește legitim când build-ul pică înainte de teste,
      # dar lipsește la fel de tăcut și când agentul JaCoCo încetează să mai ruleze (argLine
      # suprascris, execuția scoasă din pom). `ignore` face cele două cazuri
      # indistinguibile — un avertisment în log arată care dintre ele s-a întâmplat, fără
      # să pice build-ul.
      - name: Urcă raportul JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
