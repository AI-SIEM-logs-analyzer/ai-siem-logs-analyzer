name: CI · Backend (Quarkus)

# Rulează pe fiecare PR, indiferent de fișierele atinse: un check filtrat pe `paths` nu
# pornește deloc pe PR-urile care nu ating backend/, iar branch protection îl așteaptă la
# nesfârșit. Push-urile pe branch-uri de lucru rămân filtrate.
on:
  pull_request:
  push:
    branches-ignore: ['main']
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verifică formatarea (Spotless)
        run: ./mvnw -B spotless:check

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

      # Fork PRs don't get repo secrets, so MAXMIND_LICENSE_KEY is unset there; skip rather than
      # fail, since %test runs with app.geoip.enabled=false and never opens these files.
      - name: Fetch GeoLite2 databases
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAXMIND_LICENSE_KEY:-}" ]; then
            echo "::notice::MAXMIND_LICENSE_KEY not set; skipping GeoLite2 download (tests do not need it)"
            exit 0
          fi
          mkdir -p src/main/jib/opt/geoip
          TMP_GEOIP=$(mktemp -d)
          trap 'rm -rf "$TMP_GEOIP"' EXIT
          for edition in GeoLite2-City GeoLite2-ASN; do
            curl -fsSL \
              "https://download.maxmind.com/app/geoip_download?edition_id=${edition}&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz" \
              | tar -xz -C "$TMP_GEOIP"
            find "$TMP_GEOIP" -name "${edition}.mmdb" -exec mv {} "src/main/jib/opt/geoip/${edition}.mmdb" \;
          done
          ls -la src/main/jib/opt/geoip

      - name: Build + teste (JUnit5 + RestAssured, Testcontainers)
        run: ./mvnw -B clean verify

      # The build writes the spec to target/openapi/ (quarkus.smallrye-openapi.store-schema-directory).
      # The frontend's typed client is generated from the committed copy, so an API change has to
      # bring that copy along: `make api-client` refreshes it and regenerates the types.
      - name: Verifică că frontend/openapi/openapi.json e la zi
        run: |
          if ! diff -u ../frontend/openapi/openapi.json target/openapi/openapi.json; then
            echo "::error file=frontend/openapi/openapi.json::The OpenAPI spec changed. Run 'make api-client' and commit the result."
            exit 1
          fi

      # `warn`, nu `ignore`: raportul lipsește legitim când build-ul pică înainte de teste,
      # dar lipsește la fel de tăcut și când agentul JaCoCo încetează să mai ruleze (argLine
      # suprascris, execuția scoasă din pom). `ignore` face cele două cazuri
      # indistinguibile — un avertisment în log arată care dintre ele s-a întâmplat, fără
      # să pice build-ul.
      - name: Urcă raportul JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
