name: CI · Frontend (React)

# Rulează pe fiecare PR, indiferent de fișierele atinse — vezi nota din ci-backend.yml.
on:
  pull_request:
  push:
    branches-ignore: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads it from the packageManager field.
      # Giving both makes it abort with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Verifică formatarea (Prettier)
        run: pnpm format:check

      - name: Type check (tsc --noEmit)
        run: pnpm typecheck

      # Testele (Vitest) și build-ul (Vite) revin odată cu scheletul aplicației —
      # deocamdată frontend/ conține doar configurația de tooling.
