# .github/workflows/cd.yml
# CD: la merge pe main -> build imagini -> push în GitHub Container Registry (ghcr.io) -> deploy.
#
# SECRETS necesare (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     - IP/hostname server (Hetzner etc.)
#   DEPLOY_USER     - user SSH
#   DEPLOY_SSH_KEY  - cheie privată SSH (fără passphrase)
#   (pentru Fly.io: FLY_API_TOKEN)
# GITHUB_TOKEN e injectat automat, are drept de push în ghcr.io.
name: CD · Build & Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Owner lowercase (ghcr cere lowercase)
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagine backend (Quarkus + Jib)
        working-directory: backend
        run: >
          ./mvnw -B clean package -DskipTests
          -Dquarkus.container-image.build=true
          -Dquarkus.container-image.push=true
          -Dquarkus.container-image.builder=jib
          -Dquarkus.container-image.registry=ghcr.io
          -Dquarkus.container-image.group=${{ steps.vars.outputs.owner }}
          -Dquarkus.container-image.name=security-log-analyzer-backend
          -Dquarkus.container-image.additional-tags=latest,${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Owner lowercase
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/security-log-analyzer-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push imagine frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (SSH + docker compose)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/security-log-analyzer
            docker compose pull
            docker compose up -d
            docker image prune -f