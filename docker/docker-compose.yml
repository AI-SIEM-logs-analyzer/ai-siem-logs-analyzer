name: ${COMPOSE_PROJECT_NAME:-siem}

services:
  postgres:
    image: postgres:16-alpine
    container_name: siem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation so index behaviour matches CI containers.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: siem-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redpanda:
    image: redpandadata/redpanda:${REDPANDA_VERSION:-v24.2.7}
    container_name: siem-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      # Two listeners: "internal" for containers on this network,
      # "external" for processes on the host (backend running via Maven, rpk, IDE).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:${REDPANDA_PROXY_PORT:-18082}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"
      - "${REDPANDA_PROXY_PORT:-18082}:18082"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Optional web UI for topics/consumer groups. Not started by default:
  #   docker compose --profile tools up -d
  console:
    image: redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v2.7.2}
    container_name: siem-redpanda-console
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8085}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # The backend API. Not started by default — the normal dev loop is
  # `./mvnw quarkus:dev` with live reload, and rebuilding an image per edit is slower.
  # Use it for demos, for frontend work, or for an end-to-end smoke test:
  #   make up-app
  #
  # `image`, not `build`: the image comes from Jib (`make image`), the same builder that
  # cd.yml uses to publish to ghcr.io. There is deliberately no Dockerfile for the app.
  backend:
    image: ${BACKEND_IMAGE:-siem/security-log-analyzer-backend}:${BACKEND_TAG:-0.1.0-SNAPSHOT}
    container_name: siem-backend
    restart: unless-stopped
    profiles: ["app"]
    # The image ships application.yaml; everything environment-specific arrives here.
    # QUARKUS_PROFILE selects the %prod block, which deliberately leaves app.ai.api-key
    # unset — the application refuses to boot unless APP_AI_API_KEY is supplied below.
    environment:
      QUARKUS_PROFILE: prod
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local-compose}
      APP_AI_API_KEY: ${APP_AI_API_KEY:?set APP_AI_API_KEY in docker/.env}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  redpandadata:
